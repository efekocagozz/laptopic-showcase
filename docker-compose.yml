# Local development services. Credentials come from backend/.env, so start this through
# the backend scripts (`npm run db:up` in backend/), which pass that file to Compose.
name: laptopic

services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${DB_NAME:?set DB_NAME in backend/.env}
            POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in backend/.env}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in backend/.env}
        ports:
            # Bound to localhost only; 6543 avoids clashing with a Postgres already on 5432.
            - '127.0.0.1:${DB_PORT:-6543}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 2s
            timeout: 5s
            retries: 20

volumes:
    postgres_data:
