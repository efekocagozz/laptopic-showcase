# Weekly dependency update pull requests. CI runs on each, so updates only merge when tests pass.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    ignore:
      # Core toolchain majors move together with Vendure and the Next.js starter; upgrade them deliberately.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: graphql
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
    groups:
      # Vendure packages must stay on the same version.
      vendure:
        patterns: ['@vendure/*']
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /storefront
    ignore:
      # Core toolchain majors move together with Vendure and the Next.js starter; upgrade them deliberately.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: graphql
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /automation
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
